<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=/portifolio/" />
    <script>
      (function () {
        var basePath = '/portifolio'
        var path = window.location.pathname.replace(basePath, '')
        var search = window.location.search
        var hash = window.location.hash

        if (path && path !== '/') {
          sessionStorage.setItem('gh-pages-redirect', path + search + hash)
        }

        window.location.replace(basePath + '/')
      })()
    </script>
    <title>Redirecting</title>
  </head>
  <body></body>
</html>
